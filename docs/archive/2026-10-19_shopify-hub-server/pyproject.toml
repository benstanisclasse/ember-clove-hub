[project]
name = "shopify-hub"
version = "0.1.0"
description = "Central data + automation hub for a Shopify store, exposed to Claude over MCP."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "structlog>=24.4",
    "redis>=5.2,<7",
    "rq>=2.0,<3",
    "apscheduler>=3.10,<4",
    "httpx>=0.27,<1",
    "boto3>=1.35,<2",
    "tenacity>=9.0,<10",
    "mcp>=1.30,<2",
    "python-multipart>=0.0.9",
    "numpy>=2.0,<3",
    "lightgbm>=4.5,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "fakeredis>=2.26",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:rq.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
# E501: `ruff format` owns line length; what remains are long string literals.
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]
"migrations/**" = ["E501"]
# GAQL (Google Ads Query Language) is not SQL, and every interpolated value is int() or a date.
"app/integrations/ads/google.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
